name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-room-api
    env:
      # Disposable CI credentials, never connected to the development/production DB.
      DATABASE_URL: postgresql://sonora_ci:ci_only_password@127.0.0.1:5432/sonora_test?schema=public
      TEST_DATABASE_URL: postgresql://sonora_ci:ci_only_password@127.0.0.1:5432/sonora_test?schema=public
      GOOGLE_AUTH_ENABLED: 'false'
      MAIL_TRANSPORT: log
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: sonora_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: sonora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonora_ci -d sonora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: music-room-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Integration and migration tests
        run: npm run test:e2e
