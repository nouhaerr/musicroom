name: Mobile CI

on:
  push:
    paths: ['music-room-mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['music-room-mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: music-room-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: music-room-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:native
