# version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicroom
      POSTGRES_PASSWORD: musicroom
      POSTGRES_DB: musicroom
    ports:
      - "5432:5432"
    volumes:
      - musicroom_pgdata:/var/lib/postgresql/data

volumes:
  musicroom_pgdata:
